<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Big Cannons: Autocannon Revolution</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; }
  video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  #ui { position:fixed; bottom:30px; right:30px; z-index:10; display:flex; gap:12px; }
  #ui button {
    background:rgba(22,27,34,0.9); color:#c9d1d9; border:1px solid #30363d;
    padding:12px 24px; border-radius:8px; font-size:15px; cursor:pointer; font-family:monospace;
    backdrop-filter:blur(8px); transition:all 0.2s;
  }
  #ui button:hover { background:rgba(35,134,54,0.9); border-color:#238636; }
  #ui button.muted { border-color:#da3633; }
  #ui button.muted:hover { background:rgba(218,54,51,0.9); }
  #link { position:fixed; top:20px; left:20px; z-index:10; }
  #link a { color:#58a6ff; text-decoration:none; font-size:13px; font-family:monospace;
    background:rgba(22,27,34,0.8); padding:8px 16px; border-radius:6px; backdrop-filter:blur(8px); }
</style>
</head>
<body>

<video id="bgm" autoplay loop muted playsinline>
  <source src="bgm.mp4" type="video/mp4">
</video>

<div id="link"><a href="https://github.com/QKDream/Create-Big-Cannon-Autogun-Revolution">← 返回仓库</a></div>
<div id="ui">
  <button id="soundBtn" class="muted" onclick="toggleSound()">🔇 取消静音</button>
</div>

<script>
const video = document.getElementById('bgm');
const btn = document.getElementById('soundBtn');
video.volume = 0.6;

function toggleSound() {
  if (video.muted) {
    video.muted = false;
    btn.textContent = '🔊 静音';
    btn.className = '';
  } else {
    video.muted = true;
    btn.textContent = '🔇 取消静音';
    btn.className = 'muted';
  }
}
</script>
</body>
</html>
